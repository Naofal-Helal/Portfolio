<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/codec-pro" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Fennolal</title>
    <style>
    * {
      font-family: 'Codec Pro', sans-serif;
      margin: 0;
      box-sizing: border-box;
    }
    main {
      width: 100dvw;
      height: 100dvh;
      background: black;
      color: white;
      position: relative;
      padding: 2rem;
      display: grid;
      overflow: hidden;
      @media (width <= 500px) {
        justify-items: center;
      }
    }
    img {
      display: block;
    }
    #back {
      width: 100%;
      position: absolute;
      right: 0;
      bottom: 0;
      @media (width <= 1000px) {
        width: auto;
        height: 70dvh;
        right: -10%;
      }
      @media (width <= 500px) {
        width: auto;
        height: 60dvh;
        right: -50%;
      }
    }
    #heading {
      width: max-content;
      font-size: 3rem;
      @media (width > 1000px) {
        position: absolute;
        bottom: 40%;
        left: 1em;
      }
      @media (500px < width <= 1000px) {
        margin-block-start: 3em;
        margin-inline-start: 1em;
      }
      @media (width <= 500px) {
        margin-block-start: 3em;
        padding-left: 1ch;
      }
    }
    </style>
</head>
<body>
  <main>
    <img id="back" src="assets/img/back.svg">
    <h1 id="heading">Stay Tuned..</h1>
  </main>
</body>
</html>
